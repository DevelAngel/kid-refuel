[workspace]
resolver = "3"
members = [
    "service/front",
    "service/server",
    "service/db",
    "sim",
]
default-members = [
    "service/front",
    "service/db",
    "service/server",
]

[workspace.package]
version = "0.2.0"
authors = [
    "Angelos Drossos"
]

[workspace.dependencies]
askama = { version = "0.12.0", features = ["with-axum"] }
askama_axum = "0.3.0"
axum = { version = "0.8" }
axum-macros = { version = "0.5" }
chrono = { version = "0.4.24" }
clap = { version = "4.2.5", features = ["derive"] }
console_error_panic_hook = "0.1"
diesel = { version = "2.1.0", default-features = false, features = ["with-deprecated", "chrono", "sqlite", "returning_clauses_for_sqlite_3_35"] }
dotenvy = "0.15.7"
hyper = "0.14.26"
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
lazy_static = "1.4.0"
leptos = { version = "0.8", default-features = false, features = ["cbor"] }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }
leptos_axum = { version = "0.8" }
rand = "0.8.5"
regex = "1.8.1"
reqwest = { version = "0.11.16", default-features = false, features = ["rustls-tls"] }
scraper = "0.15.0"
serde = { version = "1" }
thiserror = { version = "1.0.40" }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = { version = "0.1.37" }
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
tracing-wasm = "0.2.1"
url = "2.3.1"
wasm-bindgen = "0.2"

[[workspace.metadata.leptos]]
name = "refuel"
bin-package = "refuel-server"
lib-package = "refuel-front"
assets-dir = "service/assets"
style-file = "service/css/main.scss"
site-root = "target/site/refuel"
