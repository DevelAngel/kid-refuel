[workspace]
resolver = "3"
members = [
    "service/front",
    "service/server",
    "service/db",
    "sim",
]
default-members = [
    "service/front",
    "service/app",
    "service/db",
    "service/server",
]

# need to be applied only to wasm build
[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[workspace.package]
version = "0.5.0"
authors = [
    "Angelos Drossos"
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
askama = { version = "0.12.0", features = ["with-axum"] }
askama_axum = "0.3.0"
assert_fs = "1.1"
axum = { version = "0.8" }
axum-macros = { version = "0.5" }
chrono = { version = "0.4.24" }
chrono-tz = "0.10"
clap = { version = "4.2.5", features = ["derive"] }
console_error_panic_hook = "0.1"
cucumber = { version = "0.21", features = ["macros"] }
diesel = { version = "2.1.0", default-features = false, features = ["with-deprecated", "chrono", "sqlite", "returning_clauses_for_sqlite_3_35"] }
dotenvy = "0.15.7"
hyper = "0.14.26"
http = "1"
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
lazy_static = "1.4.0"
leptos = { version = "0.8.2", features = ["tracing"] }
leptos_meta = "0.8.2"
leptos_router = "0.8.2"
leptos_axum = "0.8.2"
leptos-chartistry = "0.2.3"
rand = "0.8.5"
regex = "1.8.1"
reqwest = { version = "0.11.16", default-features = false, features = ["rustls-tls"] }
scraper = "0.15.0"
serde = { version = "1" }
serde_json = "1"
thiserror = { version = "1.0.40" }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = { version = "0.1.37" }
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
tracing-wasm = "0.2.1"
url = { version = "2.3.1", features = ["serde"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Coordinates", "Geolocation", "Navigator", "Position", "PositionError", "Window"] }

[[workspace.metadata.leptos]]
name = "refuel"
bin-package = "refuel-server"
lib-package = "refuel-front"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "service/public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
tailwind-input-file = "service/style/tailwind.css"
