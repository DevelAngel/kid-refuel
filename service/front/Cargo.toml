[package]
name = "refuel-front"
version.workspace = true
authors.workspace = true
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
refuel-app = { path = "../app", features = ["hydrate"] }
